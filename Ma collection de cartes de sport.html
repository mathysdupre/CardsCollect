<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma collection de cartes de sport</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--tx:#16181d;--mut:#6c6f76;--bd:#e4e1d8;--ac:#1f5f4a;--onac:#fff;--sh:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101214;--card:#1a1d21;--tx:#eceae4;--mut:#9a9da4;--bd:#2c3036;--ac:#4cc29a;--onac:#06251c;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101214;--card:#1a1d21;--tx:#eceae4;--mut:#9a9da4;--bd:#2c3036;--ac:#4cc29a;--onac:#06251c;--sh:none;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1040px;margin:0 auto;padding:16px 16px 56px}
.hero{background:linear-gradient(135deg,#1f5f4a,#0f2f26);color:#fff;border-radius:18px;padding:22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;box-shadow:var(--sh)}
h1{margin:0;font-size:28px;letter-spacing:-.02em}.hero p{margin:2px 0 0;opacity:.75}
.stats{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.stat{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 14px}.stat b{font-size:20px;display:block}.stat span{font-size:12px;opacity:.8}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--ac);color:var(--onac)}
button:disabled{opacity:.5;cursor:default}
.gold{background:#e0b04a;color:#1b1400}
.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:16px 0;box-shadow:var(--sh)}
.ai{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:12px;margin-bottom:12px;border-bottom:1px dashed var(--bd)}
.ai2{display:contents}
.ai label{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--tx)}
#prev{height:64px;border-radius:6px;border:1px solid var(--bd)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px}
.wide{grid-column:1/-1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:99px;padding:6px 14px;font-weight:500}
.chip.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.bar input,.bar select{flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh)}
.ph{position:relative;aspect-ratio:5/7;background:linear-gradient(160deg,var(--bd),var(--bg));display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.emo{font-size:56px}
.badge,.val{position:absolute;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px}
.badge{top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff}
.val{bottom:8px;right:8px;background:#e0b04a;color:#1b1400}
.bd{padding:12px;display:flex;flex-direction:column;gap:3px;flex:1}
.bd h3{margin:0;font-size:16px}.m{color:var(--mut);font-size:13px}.n{font-size:13px}
.act{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.ghost{display:inline-block;background:transparent;color:var(--mut);border:1px solid var(--bd);padding:5px 10px;font-weight:500;font-size:12px;text-decoration:none;border-radius:8px}
.danger{color:#fff;background:#c0392b;border-color:#c0392b}
.empty{text-align:center;color:var(--mut);padding:48px 0}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:20;padding:16px;cursor:zoom-out}#lb img{max-width:100%;max-height:100%;border-radius:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;max-width:90%}
button,.chip,.c,.ghost{transition:transform .15s ease,box-shadow .2s ease,background-color .2s ease,color .2s ease,border-color .2s ease,opacity .2s}
button:not(:disabled):hover{transform:translateY(-1px)}
button:not(:disabled):active{transform:scale(.96)}
.chip:hover{border-color:var(--ac)}
.chip.in{animation:pop .3s ease}
.c:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.15)}
.c.in{animation:rise .4s ease both;animation-delay:calc(var(--i,0)*45ms)}
.ph{overflow:hidden}.ph img{transition:transform .3s ease}.c:hover .ph img{transform:scale(1.05)}
.panel{animation:slide .3s ease}
#lb{animation:fade .2s ease}#lb img{animation:zoom .25s ease}
#toast{animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes slide{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes zoom{from{transform:scale(.92)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root{--glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.65);--gbd:rgba(255,255,255,.7)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(32,36,42,.55);--glass2:rgba(255,255,255,.07);--gbd:rgba(255,255,255,.14)}}
:root[data-theme="dark"]{--glass:rgba(32,36,42,.55);--glass2:rgba(255,255,255,.07);--gbd:rgba(255,255,255,.14)}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(40vmax 40vmax at 10% 5%,rgba(31,150,110,.38),transparent 60%),radial-gradient(35vmax 35vmax at 92% 12%,rgba(224,176,74,.38),transparent 60%),radial-gradient(40vmax 40vmax at 55% 100%,rgba(90,120,230,.28),transparent 60%);animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(2%,3%,0) scale(1.08)}}
.glass{position:relative;border:1px solid var(--gbd);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.45)}
.c.glass,.panel.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}


.hero.glass{border-color:rgba(255,255,255,.25)}
.stat{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2)}
input,select,textarea{background:var(--glass2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-color:var(--gbd)}
button,.c,.ghost{transition:transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease,background-color .2s ease,color .2s ease,border-color .2s ease,opacity .2s}
button:not(:disabled):hover{transform:scale(1.04)}
button:not(:disabled):active{transform:scale(.94)}
.c:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 18px 40px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.5)}
.c.in{animation:rise .55s cubic-bezier(.34,1.3,.64,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateY(-14px) scale(.96);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
.panel{animation:slide .5s cubic-bezier(.34,1.3,.64,1)}
@keyframes zoom{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#lb{background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%)}
#lb img{animation:zoom .45s cubic-bezier(.34,1.4,.64,1)}
#toast{background:rgba(30,30,30,.6);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid rgba(255,255,255,.2)}
.badge{background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25)}
.chips{position:relative;width:fit-content;max-width:100%;gap:2px;padding:6px;border-radius:99px;background:var(--glass);border:1px solid var(--gbd);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.45);scrollbar-width:none;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;z-index:1;background:transparent;border:0;color:var(--tx);transition:color .3s ease,transform .35s cubic-bezier(.34,1.56,.64,1)}
.chip.on{background:transparent;color:var(--onac)}
.chip.in{animation:none}
.pill{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:99px;background:var(--ac);opacity:0;z-index:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 14px rgba(0,0,0,.2);transition:transform .55s cubic-bezier(.34,1.4,.64,1),width .55s cubic-bezier(.34,1.4,.64,1),opacity .3s ease}
button:not(.chip),a.ghost{position:relative;isolation:isolate;border:0;border-radius:999px;color:var(--tx);text-decoration:none;background:radial-gradient(130% 110% at 50% 0%,rgba(255,255,255,.34),rgba(255,255,255,.03) 70%),var(--gb,rgba(31,150,110,.40));-webkit-backdrop-filter:blur(14px) saturate(190%);backdrop-filter:blur(14px) saturate(190%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -10px 16px rgba(120,225,255,.10),0 8px 22px rgba(0,0,0,.14)}
button:not(.chip)::before,a.ghost::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(120,225,255,.2) 35%,rgba(255,255,255,.08) 62%,rgba(120,225,255,.85));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
button:not(.chip)::after,a.ghost::after{content:"";position:absolute;top:0;left:16%;width:46%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);pointer-events:none}
button:not(.chip):not(:disabled):hover,a.ghost:hover{filter:brightness(1.12) saturate(1.1)}
.gold{--gb:rgba(224,176,74,.46)}
.sec{--gb:rgba(255,255,255,.12)}
.ghost{--gb:rgba(255,255,255,.10)}
.danger{--gb:rgba(220,60,50,.6)}
button.danger{color:#fff}
.sec.act{--gb:rgba(31,150,110,.55)}
.binder{position:relative;margin:0 0 26px;padding:18px 18px 14px 46px;border-radius:22px;background:var(--glass);border:1px solid var(--gbd);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.45);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
.binder::before{content:"";position:absolute;left:13px;top:18px;bottom:18px;width:20px;background:radial-gradient(circle at 50% 50%,rgba(190,195,202,.95) 0 6px,rgba(0,0,0,.25) 7px,transparent 8px) 0 0/20px 64px repeat-y}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bhead h2{margin:0;font-size:20px;letter-spacing:-.01em}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:0 auto}
.pg.flip{animation:flip .55s cubic-bezier(.34,1.2,.64,1);transform-origin:left center}
@keyframes flip{from{opacity:0;transform:perspective(900px) rotateY(-24deg) translateX(18px)}to{opacity:1;transform:none}}
.pk{position:relative;aspect-ratio:5/7;border-radius:10px;overflow:hidden;display:grid;place-items:center;background:rgba(127,127,127,.14);border:1px solid var(--gbd);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.pk.e{background:transparent;border-style:dashed;box-shadow:none;opacity:.55}
.pk img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.pk::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.22),transparent 38%,transparent 70%,rgba(255,255,255,.1))}
.pk .emo{font-size:38px}
.pn{position:absolute;top:6px;left:6px;z-index:1;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:1;display:flex;flex-direction:column;padding:16px 8px 6px;font-size:11px;line-height:1.25;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.cap b{font-size:12px}
.bnav{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:14px}
@media (max-width:480px){.binder{padding:16px 12px 12px 34px}.binder::before{left:8px}.pg{gap:6px}.cap{font-size:10px}}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.tools .m{font-size:12px}
</style>
</head>
<body>
<main>
<header class="hero glass">
<div><h1>Ma collection</h1><p>Cartes de sport</p></div>
<button class="gold" id="addBtn" type="button">＋ Ajouter une carte</button>
<div class="stats">
<div class="stat"><b id="sN">0</b><span>cartes</span></div>
<div class="stat"><b id="sV">0 €</b><span>valeur estimée</span></div>
<div class="stat"><b id="sC">0</b><span>collections</span></div>
</div>
</header>

<section id="panel" class="panel glass" hidden>
<div class="ai">
<button type="button" class="sec" id="photoBtn">🖼️ Ajouter une photo</button>
<span id="aiBox" class="ai2" hidden>
<button type="button" class="gold" id="scanBtn">📷 Scanner une carte</button>
<button type="button" class="sec" id="estBtn" hidden>💶 Estimer la valeur</button>
<label hidden><input type="checkbox" id="autoEst"> Estimer après le scan</label>
<label><input type="checkbox" id="autoAdd"> Ajouter directement</label>
</span>
<img id="prev" alt="Aperçu" hidden>
<span id="scanMsg" class="m"></span>
<input id="scanIn" type="file" accept="image/*" hidden>
</div>
<form id="f">
<label>Joueur / sujet<input name="joueur" required></label>
<label>Collection<input name="collection" list="cols" placeholder="Ex. NBA 2024"></label>
<label>Sport<select name="sport"><option>Football</option><option>Basket</option><option>Baseball</option><option>Hockey</option><option>Rugby</option><option>Tennis</option><option>Formule 1</option><option>Autre</option></select></label>
<label>Année<input name="annee" type="number" min="1850" max="2100" placeholder="2024"></label>
<label>Marque / série<input name="serie" placeholder="Panini, Topps…"></label>
<label>Numéro<input name="numero" placeholder="#12"></label>
<label>État<select name="etat"><option>Neuve</option><option>Excellent</option><option>Bon</option><option>Moyen</option><option>Abîmée</option></select></label>
<label>Valeur (€)<input name="valeur" type="number" min="0" step="0.5"></label>
<label class="wide">Notes<textarea name="notes" rows="2" placeholder="Édition limitée, signée, doublon…"></textarea></label>
<div class="wide"><button type="submit">Ajouter la carte</button></div>
</form>
<datalist id="cols"></datalist>
</section>

<div class="tools">
<button type="button" class="sec" id="exBtn" hidden>⬇︎ Exporter mes cartes</button>
<button type="button" class="sec" id="imBtn">⬆︎ Importer les prix</button>
<input id="imIn" type="file" accept=".json,application/json" hidden>
<span class="m">Prix : exporte tes cartes, lance le programme sur ton PC, puis importe prix.json.</span>
</div>
<div id="chips" class="chips"><span id="pill" class="pill"></span></div>
<div class="bar">
<button type="button" class="sec act" id="vC">📖 Classeur</button><button type="button" class="sec" id="vL">▦ Liste</button>
<input id="q" type="search" placeholder="Rechercher…">
<select id="fs"></select>
<select id="so">
<option value="recent">Dernières ajoutées</option>
<option value="joueur">Joueur (A→Z)</option>
<option value="annee">Année (récente d’abord)</option>
<option value="valeur">Valeur (haute d’abord)</option>
</select>
</div>
<div id="binders"></div>
<div id="g" class="grid"></div>
<p id="e" class="empty" hidden></p>
</main>
<div id="lb" hidden><img id="lbi" alt=""></div>
<div id="toast" hidden></div>

<script>
(function(){
var KEY="cartes-sport-v1",cards=[],col="",photo="",mode="scan",canImg=false,canAI=false,formEst=false,formNote="",anim=true,colRef=null,view="classeur",bp={},tt;
var EMO={"Football":"⚽","Basket":"🏀","Baseball":"⚾","Hockey":"🏒","Rugby":"🏉","Tennis":"🎾","Formule 1":"🏎️","Autre":"🏅"};
try{cards=JSON.parse(localStorage.getItem(KEY)||"[]")||[];}catch(e){cards=[];}
var $=function(i){return document.getElementById(i)};
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;}
function toast(m){var t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true;},4500);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(cards));return true;}catch(e){toast("Stockage plein : supprime des cartes pour libérer de la place.");return false;}}
function errMsg(e){return e&&e.code==="rate_limited"?"Trop de demandes d’affilée, patiente un instant.":e&&e.code==="not_granted"?"L’autorisation n’a pas été accordée.":"Lecture impossible, réessaie (photo plus nette si besoin).";}
function parseJ(t){var m=String(t||"").match(/\{[\s\S]*\}/);return JSON.parse(m?m[0]:"");}
function dataBlob(u){var p=u.split(","),b=atob(p[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:"image/jpeg"});}

var sampleP=null;
function getSample(){
  if(!sampleP)sampleP=(window.claude&&claude.use?claude.use("sample"):Promise.resolve(null)).catch(function(){return null;});
  return sampleP;
}
/* Stockage en ligne : ta collection est enregistrée dans ton espace privé de la page */
function dbErr(e){toast(e&&e.code==="quota_exceeded"?"Espace en ligne plein : supprime des cartes ou des photos.":"Enregistrement en ligne impossible pour le moment.");}
function persist(c){
  var i=cards.findIndex(function(x){return x.id===c.id;});
  if(i<0)cards.push(c);else cards[i]=c;
  if(colRef)colRef.doc(String(c.id)).set(c).catch(dbErr);else save();
}
function removeCard(id){
  cards=cards.filter(function(x){return x.id!==id;});
  if(colRef)colRef.doc(String(id)).delete().catch(dbErr);else save();
}
var MIG=KEY+"-migre";
(async function(){
  try{
    var db=await claude.use("db"),us=await claude.use("user");
    var uid=us&&await us.id();
    if(!db||!uid)return;
    var ref=db.collection("data/users/"+uid),first=true;
    ref.onSnapshot(function(snap){
      if(snap.metadata.fromCache&&snap.empty)return;
      if(!snap.metadata.fromCache&&first){
        first=false;
        var flag=null;try{flag=localStorage.getItem(MIG);}catch(e){}
        if(snap.empty&&!flag&&cards.length){
          try{localStorage.setItem(MIG,"1");}catch(e){}
          colRef=ref;
          cards.forEach(function(c){ref.doc(String(c.id)).set(c).catch(dbErr);});
          return;
        }
      }
      colRef=ref;
      cards=snap.docs.map(function(d){return Object.assign({},d.data());});
      render();
    },function(){});
  }catch(e){}
})();

getSample().then(function(s){
  if(!s)return;
  Promise.resolve(s.limits?s.limits():{images:true}).then(function(l){
    canImg=!!(l&&l.images);canAI=true;$("aiBox").hidden=!canImg;render();
  }).catch(function(){});
});

/* Vue classeur : une reliure par collection, cartes classées par numéro, 9 pochettes par page */
function num(c){var m=String(c.numero||"").match(/\d+/);return m?parseInt(m[0],10):1e9;}
function pocket(c){
  var pk=el("div","pk"+(c?"":" e"));
  if(!c)return pk;
  if(c.photo){var im=el("img");im.src=c.photo;im.alt=c.joueur;im.onclick=function(){$("lbi").src=c.photo;$("lb").hidden=false;};pk.appendChild(im);}
  else pk.appendChild(el("span","emo",EMO[c.sport]||"🏅"));
  if(c.numero)pk.appendChild(el("span","pn","#"+String(c.numero).replace(/^#/,"")));
  var cap=el("div","cap");cap.appendChild(el("b",null,c.joueur));
  if(c.valeur)cap.appendChild(el("span",null,(c.est||c.web?"≈ ":"")+c.valeur+" €"));
  pk.appendChild(cap);return pk;
}
function renderBinders(list){
  var B=$("binders"),groups={},keys=[];B.innerHTML="";
  list.forEach(function(c){var k=c.collection||"";if(!groups[k]){groups[k]=[];keys.push(k);}groups[k].push(c);});
  keys.sort(function(a,b){return a===""?1:b===""?-1:a.localeCompare(b,"fr");});
  keys.forEach(function(k){
    var arr=groups[k].slice().sort(function(a,b){return num(a)-num(b)||a.joueur.localeCompare(b.joueur,"fr");});
    var np=Math.max(1,Math.ceil(arr.length/9)),p=Math.min(bp[k]||0,np-1),tot=0;bp[k]=p;
    arr.forEach(function(c){tot+=c.valeur||0;});
    var bd=el("section","binder"),h=el("div","bhead");
    h.appendChild(el("h2",null,k||"Sans collection"));
    h.appendChild(el("span","m",arr.length+" carte"+(arr.length>1?"s":"")+(tot?" · "+Math.round(tot*100)/100+" €":"")));
    bd.appendChild(h);
    var pg=el("div","pg"+(anim?" flip":""));
    for(var i=0;i<9;i++)pg.appendChild(pocket(arr[p*9+i]));
    bd.appendChild(pg);
    var nav=el("div","bnav"),pr=el("button","sec","‹"),nx=el("button","sec","›");
    pr.type=nx.type="button";pr.disabled=p<=0;nx.disabled=p>=np-1;
    pr.onclick=function(){bp[k]=p-1;anim=true;render();};
    nx.onclick=function(){bp[k]=p+1;anim=true;render();};
    nav.appendChild(pr);nav.appendChild(el("span","m","Page "+(p+1)+" / "+np));nav.appendChild(nx);
    bd.appendChild(nav);B.appendChild(bd);
  });
}

function render(){
  var q=$("q").value.trim().toLowerCase(),so=$("so").value,fs=$("fs"),cur=fs.value;
  var cn={},sports=[],none=0,total=0;
  cards.forEach(function(c){
    if(c.collection)cn[c.collection]=(cn[c.collection]||0)+1;else none++;
    if(sports.indexOf(c.sport)<0)sports.push(c.sport);
    total+=c.valeur||0;
  });
  var names=Object.keys(cn).sort(function(a,b){return a.localeCompare(b,"fr");});
  if(col&&col!=="__none"&&!cn[col])col="";
  var ch=$("chips"),pill=$("pill");ch.innerHTML="";ch.appendChild(pill);
  function chip(label,key,n){var b=el("button","chip"+(col===key?(anim?" on in":" on"):""),label+" ("+n+")");b.type="button";b.onclick=function(){col=key;anim=true;render();};ch.appendChild(b);}
  chip("Toutes","",cards.length);
  names.forEach(function(n){chip(n,n,cn[n]);});
  if(none&&names.length)chip("Sans collection","__none",none);
  var on=ch.querySelector(".chip.on");
  if(on){pill.style.width=on.offsetWidth+"px";pill.style.transform="translateX("+on.offsetLeft+"px)";pill.style.opacity=1;}
  $("cols").innerHTML="";
  names.forEach(function(n){var o=el("option");o.value=n;$("cols").appendChild(o);});
  fs.innerHTML="";var o0=el("option",null,"Tous les sports");o0.value="";fs.appendChild(o0);
  sports.sort().forEach(function(s){var o=el("option",null,s);o.value=s;fs.appendChild(o);});
  fs.value=sports.indexOf(cur)>=0?cur:"";
  var list=cards.filter(function(c){
    if(col==="__none"?c.collection:(col&&c.collection!==col))return false;
    if(fs.value&&c.sport!==fs.value)return false;
    return !q||[c.joueur,c.serie,c.notes,c.sport,c.numero,c.collection].join(" ").toLowerCase().indexOf(q)>=0;
  });
  list.sort(function(a,b){
    if(so==="joueur")return a.joueur.localeCompare(b.joueur,"fr");
    if(so==="annee")return (b.annee||0)-(a.annee||0);
    if(so==="valeur")return (b.valeur||0)-(a.valeur||0);
    return b.id-a.id;
  });
  var g=$("g");g.innerHTML="";
  list.forEach(function(c){
    var d=el("article","c glass"+(anim?" in":"")),ph=el("div","ph");d.style.setProperty("--i",Math.min(list.indexOf(c),12));
    if(c.photo){var im=el("img");im.src=c.photo;im.alt=c.joueur;im.onclick=function(){$("lbi").src=c.photo;$("lb").hidden=false;};ph.appendChild(im);}
    else ph.appendChild(el("span","emo",EMO[c.sport]||"🏅"));
    if(c.collection)ph.appendChild(el("span","badge",c.collection));
    if(c.valeur)ph.appendChild(el("span","val",(c.est||c.web?"≈ ":"")+c.valeur+" €"));
    d.appendChild(ph);
    var b=el("div","bd");
    b.appendChild(el("h3",null,c.joueur));
    b.appendChild(el("div","m",[c.sport,c.annee,c.serie,c.numero].filter(Boolean).join(" · ")));
    b.appendChild(el("div","m","État : "+c.etat));
    if(c.notes)b.appendChild(el("div","n",c.notes));
    if(c.web)b.appendChild(el("div","m","Prix web : "+c.estNote));else b.appendChild(el("div","m","⚠︎ Prix à vérifier"));
    var act=el("div","act");
    if(false){
      var eb=el("button","ghost","Estimer");eb.type="button";
      eb.onclick=async function(){
        eb.disabled=true;eb.textContent="Estimation…";
        try{var r=await estimate(c,c.photo);c.valeur=r.mid;c.est=true;c.web=false;c.estNote=r.min+"–"+r.max+" € · "+r.note;persist(c);}
        catch(e){toast(errMsg(e));}
        render();
      };
      act.appendChild(eb);
    }
    var a=el("a","ghost","Prix réels");
    a.href="https://www.ebay.fr/sch/i.html?_nkw="+encodeURIComponent([c.joueur,c.annee||"",c.serie,c.numero].join(" ").trim())+"&LH_Sold=1&LH_Complete=1";
    a.target="_blank";a.rel="noopener";act.appendChild(a);
    var del=el("button","ghost","Supprimer"),t;del.type="button";
    del.onclick=function(){
      if(del.dataset.arm){clearTimeout(t);removeCard(c.id);render();}
      else{del.dataset.arm="1";del.textContent="Confirmer ?";del.classList.add("danger");
        t=setTimeout(function(){del.dataset.arm="";del.textContent="Supprimer";del.classList.remove("danger");},3000);}
    };
    act.appendChild(del);b.appendChild(act);d.appendChild(b);g.appendChild(d);
  });
  renderBinders(list);
  $("g").hidden=view==="classeur";$("binders").hidden=view!=="classeur";
  $("vC").classList.toggle("act",view==="classeur");$("vL").classList.toggle("act",view!=="classeur");
  anim=false;var e=$("e");e.hidden=list.length>0;
  e.textContent=cards.length?"Aucun résultat.":"Aucune carte pour le moment. Clique sur « Ajouter une carte ».";
  $("sN").textContent=cards.length;
  $("sV").textContent=Math.round(total*100)/100+" €";
  $("sC").textContent=names.length;
}

/* Estimation stable : même carte = même prix (médiane de 3 analyses, mémorisée 30 jours) */
var PK="cartes-prix-v1",TTL=30*864e5;
function ckey(c){return [c.joueur,c.sport,c.annee,c.serie,c.numero,c.etat].map(function(x){return String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();}).join("|");}
function pcache(){try{return JSON.parse(localStorage.getItem(PK)||"{}")||{};}catch(e){return {};}}
async function estimate(c){
  var k=ckey(c),pc=pcache(),h=pc[k];
  if(h&&Date.now()-h.t<TTL)return h;
  var rs=await Promise.allSettled([1,2,3].map(function(){return estimateOnce(c,null);}));
  var ok=rs.filter(function(r){return r.status==="fulfilled";}).map(function(r){return r.value;});
  if(!ok.length)throw rs[0].reason;
  ok.sort(function(a,b){return a.mid-b.mid;});
  var m=ok[Math.floor(ok.length/2)],r={min:m.min,max:m.max,mid:m.mid,note:m.note,t:Date.now()};
  pc[k]=r;try{localStorage.setItem(PK,JSON.stringify(pc));}catch(e){}
  return r;
}
async function estimateOnce(c,ph){
  var s=await getSample();if(!s)throw {code:"na"};
  var desc=[c.joueur,c.sport,c.annee,c.serie,c.numero&&("n° "+c.numero),c.etat&&("état : "+c.etat),c.notes].filter(Boolean).join(", ");
  var o={cache:false};if(ph&&canImg)o.images=[dataBlob(ph)];
  var out=await s("Estime la valeur de revente approximative en euros de cette carte de sport à collectionner : "+desc+". Tu n’as pas accès à Internet : appuie-toi sur tes connaissances du marché (ventes passées, rareté, état, joueur, série) et sur la photo si elle est fournie. Réponds uniquement par un objet JSON : {\"min\":nombre,\"max\":nombre,\"note\":\"une phrase courte sur ce qui fait varier le prix\"}. Si tu ne peux pas identifier précisément la carte, donne une fourchette prudente et dis-le dans note. Arrondis les valeurs (à 5 € près sous 100 €, à 10 € près au-delà).",o);
  var d=parseJ(out.text),mn=Math.round(+d.min),mx=Math.round(+d.max);
  if(!(mn>=0&&mx>=mn))throw new Error("x");
  return {min:mn,max:mx,mid:Math.round((mn+mx)/2),note:d.note||""};
}

function formCard(){var F=$("f").elements;return {joueur:F.joueur.value.trim(),sport:F.sport.value,annee:parseInt(F.annee.value)||0,serie:F.serie.value.trim(),numero:F.numero.value.trim(),etat:F.etat.value,notes:F.notes.value.trim(),collection:F.collection.value.trim()};}
async function doFormEst(){var r=await estimate(formCard(),photo);$("f").elements.valeur.value=r.mid;formEst=true;formNote=r.min+"–"+r.max+" € · "+r.note;}
function addFromForm(){
  var c=formCard(),F=$("f").elements;
  c.id=Date.now();c.valeur=parseFloat(F.valeur.value)||0;c.photo=photo;
  if(formEst&&c.valeur){c.est=true;c.estNote=formNote;}
  persist(c);
  var keep=c.collection;$("f").reset();F.collection.value=keep;
  photo="";formEst=false;$("prev").hidden=true;anim=true;render();
}

function shrink(file,max,q){return new Promise(function(res,rej){
  var u=URL.createObjectURL(file),im=new Image();
  im.onload=function(){
    var k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement("canvas");
    cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
    cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);
    cv.toBlob(function(b){b?res(b):rej(new Error("img"));},"image/jpeg",q);
  };
  im.onerror=function(){URL.revokeObjectURL(u);rej(new Error("img"));};
  im.src=u;
});}
function toURL(b){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result);};r.readAsDataURL(b);});}
function normSet(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();}
function setYear(s){var m=normSet(s).match(/\b(19|20)\d\d/);return m?m[0]:"";}
function setWords(s){return normSet(s).replace(/\b\d+\b/g,"").replace(/\s+/g,"");}
/* Collection d’une carte scannée : lue sur la carte (ou déduite de l’année + la série), jamais héritée de la carte précédente ; réutilise le nom d’une collection existante de même année et même série */
function pickCollection(d){
  var cand=String(d.collection||"").trim();
  if(!cand&&d.annee&&d.serie)cand=d.annee+" "+String(d.serie).trim();
  if(!cand)return "";
  var y=setYear(cand),w=setWords(cand),best=null;
  cards.forEach(function(c){
    if(!c.collection||best)return;
    if(setYear(c.collection)===y&&w&&setWords(c.collection)===w)best=c.collection;
  });
  return best||cand;
}
function pick(sel,val,fb){sel.value=Array.prototype.some.call(sel.options,function(o){return o.value===val;})?val:fb;}
var PROMPT="Tu reçois la photo d’une carte de sport à collectionner. Réponds uniquement par un objet JSON, sans texte autour, avec ces clés : joueur (nom du joueur ou du sujet), sport (exactement l’une de ces valeurs : Football, Basket, Baseball, Hockey, Rugby, Tennis, Formule 1, Autre), annee (nombre ou null), serie (marque et série, par exemple Panini Prizm), numero (numéro de la carte, ou une chaîne vide), etat (exactement l’une de ces valeurs : Neuve, Excellent, Bon, Moyen, Abîmée, estimée d’après la photo), notes (détails utiles : équipe, signature, édition spéciale, et pour une carte sous coque gradée la note et le numéro de certificat, par exemple PSA 10 cert 12345678), collection (le set d’origine de la carte, au format année + marque + série, par exemple 2001-02 Upper Deck ; chaîne vide si illisible). N’invente rien : mets une chaîne vide ou null quand une information n’est pas lisible.";

$("addBtn").onclick=function(){var p=$("panel");p.hidden=!p.hidden;if(!p.hidden)p.scrollIntoView({behavior:"smooth"});};
$("scanBtn").onclick=function(){mode="scan";$("scanIn").click();};
$("photoBtn").onclick=function(){mode="photo";$("scanIn").click();};
$("lb").onclick=function(){$("lb").hidden=true;};
$("f").elements.valeur.addEventListener("input",function(){formEst=false;});
$("f").addEventListener("submit",function(ev){ev.preventDefault();addFromForm();});
$("estBtn").onclick=async function(){
  if(!formCard().joueur){toast("Renseigne d’abord le joueur.");return;}
  var b=$("estBtn"),m=$("scanMsg");b.disabled=true;m.textContent="Estimation de la valeur…";
  try{await doFormEst();m.textContent="Valeur estimée. C’est une approximation, vérifie avec « Prix réels ».";}
  catch(e){m.textContent="";toast(errMsg(e));}
  b.disabled=false;
};
$("scanIn").addEventListener("change",async function(){
  var file=this.files[0];this.value="";if(!file)return;
  var msg=$("scanMsg"),bs=[$("scanBtn"),$("photoBtn"),$("estBtn")];
  bs.forEach(function(b){b.disabled=true;});
  try{
    photo=await toURL(await shrink(file,520,.7));$("prev").src=photo;$("prev").hidden=false;
    if(mode==="photo"){msg.textContent="Photo ajoutée.";return;}
    msg.textContent="Lecture de la carte…";
    var s=await getSample();if(!s){msg.textContent="Scan indisponible ici.";return;}
    var known=[];cards.forEach(function(c){if(c.collection&&known.indexOf(c.collection)<0)known.push(c.collection);});
    var extra="";
    var out=await s(PROMPT+extra,{images:[await shrink(file,1400,.85)],cache:false});
    var d=parseJ(out.text),F=$("f").elements;
    F.joueur.value=d.joueur||"";pick(F.sport,d.sport,"Autre");F.annee.value=d.annee||"";
    F.serie.value=d.serie||"";F.numero.value=d.numero||"";pick(F.etat,d.etat,"Bon");F.notes.value=d.notes||"";
    F.collection.value=pickCollection(d);
    formEst=false;F.valeur.value="";
    if($("autoEst").checked&&F.joueur.value.trim()){
      msg.textContent="Estimation de la valeur…";
      try{await doFormEst();}catch(e){toast(errMsg(e));}
    }
    if($("autoAdd").checked&&F.joueur.value.trim()){addFromForm();msg.textContent="Carte ajoutée. Tu peux en scanner une autre.";}
    else msg.textContent="Carte lue. Vérifie les champs, puis clique sur Ajouter.";
  }catch(e){msg.textContent=errMsg(e);}
  finally{bs.forEach(function(b){b.disabled=false;});}
});
["q","fs","so"].forEach(function(i){$(i).addEventListener("input",render);});
$("vC").onclick=function(){view="classeur";anim=true;render();};
$("vL").onclick=function(){view="liste";anim=true;render();};

/* Export des cartes (pour le programme de prix) et import des prix calculés */
var dlP=(window.claude&&claude.use?claude.use("downloads"):Promise.resolve(null)).catch(function(){return null;});
dlP.then(function(d){$("exBtn").hidden=!d;});
$("exBtn").onclick=async function(){
  var d=await dlP;if(!d){toast("Export indisponible ici.");return;}
  var arr=cards.map(function(c){return {id:c.id,joueur:c.joueur,sport:c.sport,annee:c.annee,serie:c.serie,numero:c.numero,etat:c.etat,notes:c.notes,collection:c.collection};});
  try{await d.save({filename:"cartes.json",data:JSON.stringify(arr)});toast("cartes.json enregistré. Lance maintenant le programme sur ton PC.");}
  catch(e){if(!e||e.code!=="declined")toast("Export impossible.");}
};
$("imBtn").onclick=function(){$("imIn").click();};
$("imIn").addEventListener("change",function(){
  var f=this.files[0];this.value="";if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(String(r.result).replace(/^\uFEFF/,"")),n=0;
      cards.slice().forEach(function(c){
        var p=d[String(c.id)];
        if(!p||!(p.valeur>=0))return;
        c.valeur=p.valeur;c.web=true;c.est=false;c.estNote=p.note||"";persist(c);n++;
      });
      anim=true;render();
      toast(n?n+" carte(s) mise(s) à jour avec les prix du web.":"Aucune carte du fichier ne correspond à ta collection.");
    }catch(e){toast("Fichier de prix illisible.");}
  };
  r.readAsText(f);
});

render();
})();
